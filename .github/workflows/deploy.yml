name: Deploy Application with Custom Names

on:
  push:
    branches: [ main, master ]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest
    
    - name: Run tests
      run: |
        pytest test_app.py -v
    
    - name: Start app and record deployment
      run: |
        # Start the app on port 5001
        python app.py --port=5001 &
        sleep 5
        # Record deployment on port 5001
        curl -X POST http://localhost:5001/deploy
        # Get deployment info
        curl -s http://localhost:5001 | grep -o "Deploy #[0-9]*" | head -1
    
    - name: Show deployment info
      run: |
        echo "✅ Deployment successful!"
        echo "📝 Commit: ${{ github.event.head_commit.message }}"
        echo "🔄 Commit count: $(git rev-list --count HEAD)"
        echo ""
        echo "📊 DEPLOYMENT SUMMARY:"
        echo "   Name: $(git log -1 --pretty=%B | grep -o 'deploy:.*' | sed 's/deploy://' | xargs || echo 'Auto')"
        echo "   Commit: $(git log -1 --pretty=%B)"
        echo "   Deploy #: $(curl -s http://localhost:5001 | grep -o 'Deploy #[0-9]*' | head -1 | sed 's/Deploy #//' || echo '1')"
