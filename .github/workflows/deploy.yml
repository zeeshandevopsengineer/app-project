---
name: Deploy App

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deployment_engineer:
        description: 'Deployment Engineer Name'
        required: true
        default: 'Zeeshan DevOps Engineer'
        type: string
      deployment_name:
        description: 'Deployment Name'
        required: true
        default: 'My Feature'
        type: string
      commit_message:
        description: 'Commit Message'
        required: true
        default: 'deploy: My Feature'
        type: string
      important_notice:
        description: 'Important Notice'
        required: false
        default: 'Use deploy: Your Special Name'
        type: string
      message_of_the_day:
        description: 'Message of the Day'
        required: false
        default: 'Keep coding and deploying!'
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt pytest
      - run: pytest test_app.py -v
      - name: Deploy
        env:
          ENGINEER: ${{ github.event.inputs.deployment_engineer }}
          NAME: ${{ github.event.inputs.deployment_name }}
          COMMIT: ${{ github.event.inputs.commit_message }}
          NOTICE: ${{ github.event.inputs.important_notice }}
          MOTD: ${{ github.event.inputs.message_of_the_day }}
          RUN: ${{ github.run_number }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          python app.py --port=5001 &
          sleep 5
          curl -X POST http://localhost:5001/deploy \
            -H "Content-Type: application/json" \
            -d '{"deployment_engineer":"'"$ENGINEER"'",' \
            -d '"deployment_name":"'"$NAME"'",' \
            -d '"commit_message":"'"$COMMIT"'",' \
            -d '"important_notice":"'"$NOTICE"'",' \
            -d '"message_of_the_day":"'"$MOTD"'",' \
            -d '"run_number":"'"$RUN"'",' \
            -d '"actor":"'"$ACTOR"'",' \
            -d '"sha":"'"$SHA"'"}'
