name: Deploy Application

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest
    
    - name: Run tests
      run: |
        pytest test_app.py -v
    
    - name: Start app and record deployment
      run: |
        python app.py --port=5001 &
        sleep 3
        curl -X POST http://localhost:5001/deploy -H "Content-Type: application/json" -d '{"deployment_name":"GitHub Actions Deploy"}'
    
    - name: Show success
      run: |
        echo "✅ Deployment successful!"
